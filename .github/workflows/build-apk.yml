name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
      - 'latest'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Release Files
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | cut -d '"' -f 2)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found generated APK: $APK_PATH"
          cp "$APK_PATH" "Google-Antigravity-v${VERSION}.apk"
          cp "$APK_PATH" "Antigravity-v${VERSION}.apk"
          ls -lh "Google-Antigravity-v${VERSION}.apk" "Antigravity-v${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Google-Antigravity-v${{ env.APP_VERSION }}
          path: Google-Antigravity-v${{ env.APP_VERSION }}.apk

      # 1. Versioned Release (e.g. v1.5.1)
      - name: Create or Update Version Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Google-Antigravity-v${{ env.APP_VERSION }}.apk
            Antigravity-v${{ env.APP_VERSION }}.apk
          tag_name: ${{ github.ref_name }}
          name: Google Antigravity Mobile ${{ github.ref_name }}
          body: |
            ### 🚀 Google Antigravity Native Android App (${{ github.ref_name }})
            
            100% Native Android application for **Google Antigravity** ([antigravity.google.com](https://antigravity.google.com)).
            
            #### 📱 Native Features:
            - **Intelligent Assistant & Diagnostics**: Context-aware assistant answers questions, generates code, and never triggers unrequested tool approvals.
            - **Google Antigravity Cloud Mode**: Connect to `https://antigravity.google.com` using your active conversation workspace ID.
            - **Next-Gen Antigravity Models**: Upgraded to the current ecosystem fleet: **Gemini 4 Argon** (Recommended), **Gemini 3.8 Flash**, **Claude Opus 5.5**, **Claude Sonnet 5.5**, and **GPT-OSS 12B**.
            - **BYOK Direct Gemini API**: Enter your Google AI Studio key (`AIzaSy...`) for direct, standalone cloud API calls without consuming Antigravity subscription credits.
            - **100% Native UI**: RecyclerView message stream, native Material 3 cards, native touch ripples, zero WebViews.
            - **Antigravity SDK & Backend Integration**: Native agent loop, reasoning stream, tool execution, and diff blocks.
            - **Explicit Command Approvals**: Interactive Approve and Reject action buttons triggered only when requested.
            - **Official Google Antigravity Brand Icon**: Full-color gradient arch logo across adaptive and all density mipmaps.
            - **Native Terminal Console & Quick Slash Dock**: `/diff`, `/goal`, `/plan`, `/teamwork`, `/grill-me`.
            
            #### 📦 Download:
            - **[Google-Antigravity-v${{ env.APP_VERSION }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Google-Antigravity-v${{ env.APP_VERSION }}.apk)** (Primary)
            - **[Antigravity-v${{ env.APP_VERSION }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Antigravity-v${{ env.APP_VERSION }}.apk)** (Short name)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Latest Release (tag 'latest')
      - name: Create or Update Latest Release Tag
        if: startsWith(github.ref, 'refs/tags/v') || github.ref_name == 'latest' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Google-Antigravity-v${{ env.APP_VERSION }}.apk
            Antigravity-v${{ env.APP_VERSION }}.apk
          tag_name: latest
          name: Google Antigravity Mobile (Latest - v${{ env.APP_VERSION }})
          make_latest: true
          body: |
            ### 🚀 Google Antigravity Native Android App (Latest - v${{ env.APP_VERSION }})
            
            100% Native Android application for **Google Antigravity** ([antigravity.google.com](https://antigravity.google.com)).
            
            #### 📱 Native Features:
            - **Intelligent Assistant & Diagnostics**: Context-aware assistant answers questions, generates code, and never triggers unrequested tool approvals.
            - **Google Antigravity Cloud Mode**: Connect to `https://antigravity.google.com` using your active conversation workspace ID.
            - **Next-Gen Antigravity Models**: Upgraded to the current ecosystem fleet: **Gemini 4 Argon** (Recommended), **Gemini 3.8 Flash**, **Claude Opus 5.5**, **Claude Sonnet 5.5**, and **GPT-OSS 12B**.
            - **BYOK Direct Gemini API**: Enter your Google AI Studio key (`AIzaSy...`) for direct, standalone cloud API calls without consuming Antigravity subscription credits.
            - **100% Native UI**: RecyclerView message stream, native Material 3 cards, native touch ripples, zero WebViews.
            - **Antigravity SDK & Backend Integration**: Native agent loop, reasoning stream, tool execution, and diff blocks.
            - **Explicit Command Approvals**: Interactive Approve and Reject action buttons triggered only when requested.
            - **Official Google Antigravity Brand Icon**: Full-color gradient arch logo across adaptive and all density mipmaps.
            - **Native Terminal Console & Quick Slash Dock**: `/diff`, `/goal`, `/plan`, `/teamwork`, `/grill-me`.
            
            #### 📦 Download:
            - **[Google-Antigravity-v${{ env.APP_VERSION }}.apk](https://github.com/${{ github.repository }}/releases/download/latest/Google-Antigravity-v${{ env.APP_VERSION }}.apk)** (Primary with version number)
            - **[Antigravity-v${{ env.APP_VERSION }}.apk](https://github.com/${{ github.repository }}/releases/download/latest/Antigravity-v${{ env.APP_VERSION }}.apk)** (Short name with version number)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
