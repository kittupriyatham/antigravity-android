name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
      - 'latest'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Release Files
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found generated APK: $APK_PATH"
          VERSION="1.3.0"
          cp "$APK_PATH" "Google-Antigravity-v${VERSION}.apk"
          cp "$APK_PATH" "Antigravity-v${VERSION}.apk"
          ls -lh "Google-Antigravity-v${VERSION}.apk" "Antigravity-v${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Google-Antigravity-v1.3.0
          path: Google-Antigravity-v1.3.0.apk

      # 1. Versioned Release (e.g. v1.3.0)
      - name: Create or Update Version Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Google-Antigravity-v1.3.0.apk
            Antigravity-v1.3.0.apk
          tag_name: ${{ github.ref_name }}
          name: Google Antigravity Mobile ${{ github.ref_name }}
          body: |
            ### 🚀 Google Antigravity Native Android App (${{ github.ref_name }})
            
            100% Native Android application for **Google Antigravity** ([antigravity.google.com](https://antigravity.google.com)).
            
            #### 📱 Native Features:
            - **100% Native UI**: RecyclerView message stream, native Material 3 cards, native touch ripples, zero WebViews.
            - **Antigravity SDK & Backend Integration**: Native agent loop, reasoning stream, tool execution, and diff blocks.
            - **Native Command Approvals**: Interactive Approve and Reject action buttons with status feedback.
            - **Official Google Antigravity Brand Icon**: Full-color gradient arch logo across adaptive and all density mipmaps.
            - **Native Terminal Console & Quick Slash Dock**: `/diff`, `/goal`, `/plan`, `/teamwork`, `/grill-me`.
            
            #### 📦 Download:
            - **[Google-Antigravity-v1.3.0.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Google-Antigravity-v1.3.0.apk)** (Primary)
            - **[Antigravity-v1.3.0.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Antigravity-v1.3.0.apk)** (Short name)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Latest Release (tag 'latest')
      - name: Create or Update Latest Release Tag
        if: startsWith(github.ref, 'refs/tags/v') || github.ref_name == 'latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Google-Antigravity-v1.3.0.apk
            Antigravity-v1.3.0.apk
          tag_name: latest
          name: Google Antigravity Mobile (Latest)
          make_latest: true
          body: |
            ### 🚀 Google Antigravity Native Android App (Latest - v1.3.0)
            
            100% Native Android application for **Google Antigravity** ([antigravity.google.com](https://antigravity.google.com)).
            
            #### 📱 Native Features:
            - **100% Native UI**: RecyclerView message stream, native Material 3 cards, native touch ripples, zero WebViews.
            - **Antigravity SDK & Backend Integration**: Native agent loop, reasoning stream, tool execution, and diff blocks.
            - **Native Command Approvals**: Interactive Approve and Reject action buttons with status feedback.
            - **Official Google Antigravity Brand Icon**: Full-color gradient arch logo across adaptive and all density mipmaps.
            - **Native Terminal Console & Quick Slash Dock**: `/diff`, `/goal`, `/plan`, `/teamwork`, `/grill-me`.
            
            #### 📦 Download:
            - **[Google-Antigravity-v1.3.0.apk](https://github.com/${{ github.repository }}/releases/download/latest/Google-Antigravity-v1.3.0.apk)** (Primary)
            - **[Antigravity-v1.3.0.apk](https://github.com/${{ github.repository }}/releases/download/latest/Antigravity-v1.3.0.apk)** (Short name)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
