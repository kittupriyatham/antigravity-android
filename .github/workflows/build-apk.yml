name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Android-Debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release and Attach APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: ${{ github.ref_name }}
          name: Google Antigravity Mobile ${{ github.ref_name }}
          body: |
            ### 🚀 Google Antigravity Android Companion App (${{ github.ref_name }})
            
            Android companion app for **Google Antigravity** ([antigravity.google.com](https://antigravity.google.com)).
            
            #### 📱 What's Included:
            - **Seamless Google Account Authentication** via Chrome Custom Tabs
            - **Embedded In-App Workspace View** with file chooser and pull-to-refresh
            - **Push Notifications** support for command approvals and agent task completions
            
            #### 📦 Download:
            - Download `app-debug.apk` below and install on any Android 8.0+ device.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
