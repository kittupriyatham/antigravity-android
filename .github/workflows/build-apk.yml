name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Release Files
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found generated APK: $APK_PATH"
          cp "$APK_PATH" Google-Antigravity.apk
          cp "$APK_PATH" Antigravity.apk
          ls -lh Google-Antigravity.apk Antigravity.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Google-Antigravity
          path: Google-Antigravity.apk

      - name: Create GitHub Release and Attach APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Google-Antigravity.apk
            Antigravity.apk
          tag_name: ${{ github.ref_name }}
          name: Google Antigravity Mobile ${{ github.ref_name }}
          body: |
            ### 🚀 Google Antigravity Android Companion App (${{ github.ref_name }})
            
            Android companion app for **Google Antigravity** ([antigravity.google.com](https://antigravity.google.com)).
            
            #### 📱 What's Included:
            - **Official Google Antigravity Brand Icon** (vector + high-density mipmaps)
            - **Direct In-App Experience** (no launcher chooser)
            - **Instance Switcher** (Google Cloud Remote Agents & Workstation Daemons)
            - **Quick Slash Commands Dock** (`/diff`, `/goal`, `/plan`, `/teamwork`, `/grill-me`)
            - **Voice Mode & Audio** enabled for Gemini Live
            - **Push Alerts** & File attachment support
            
            #### 📦 Download:
            - **[Google-Antigravity.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Google-Antigravity.apk)** (Primary)
            - **[Antigravity.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Antigravity.apk)** (Short name)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
